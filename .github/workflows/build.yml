name: Build ZELVYN Player APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unpack ZIP & Flatten Directories
        run: |
          # 1. Find and extract any uploaded .zip archive automatically
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          
          # 2. If files extracted into a nested ZelvynPlayer/ folder, flatten to root
          if [ -d "ZelvynPlayer" ] && [ -f "ZelvynPlayer/build.gradle.kts" ]; then
            echo "Flattening nested ZelvynPlayer folder to repository root..."
            cp -r ZelvynPlayer/* .
            rm -rf ZelvynPlayer
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK & Release Bundle
        run: |
          gradle assembleDebug bundleDebug --stacktrace --no-daemon

      - name: Upload Test APK (For Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: zelvyn-player-phone-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Play Store Bundle (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: zelvyn-player-playstore-bundle
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14
