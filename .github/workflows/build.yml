name: Auto-Unpack ZIP & Build ZELVYN Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Unpack ZIP File (If Uploaded as ZIP)
        run: |
          # Find any .zip file uploaded to the repo and extract it automatically
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install & Run Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK & Release Bundle
        run: gradle assembleDebug bundleDebug --stacktrace --no-daemon

      - name: Upload Test APK (For your phone)
        uses: actions/upload-artifact@v4
        with:
          name: zelvyn-player-phone-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Play Store Bundle (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: zelvyn-player-playstore-bundle
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14
